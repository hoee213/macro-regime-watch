name: 변곡점 대시보드 갱신

on:
  schedule:
    # 매일 06:07 KST (21:07 UTC 전일). GitHub 스케줄이 예약보다 2~4.5시간 늦게 돌아(2026-09 실측) 앞당김.
    # 정각·30분은 혼잡해 분 단위를 비껴 둔다.
    - cron: '7 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'   # 러너 로그가 실시간으로 보이도록
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests xlrd

      - name: 대시보드 생성
        timeout-minutes: 12
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: |
          # FRED_API_KEY는 선택 사항: 없으면 재무부·연준·뉴욕연준 원천 소스로 수집하고
          # ICE BofA OAS(FRED 전용) 카드만 결측으로 표시된다.
          if [ -z "$FRED_API_KEY" ]; then
            echo "::notice::FRED_API_KEY 없음 — 원천 소스 모드(OAS 카드 결측)"
          fi
          ARGS="--out docs --json"
          # 시크릿이 등록돼 있을 때만 텔레그램 발송
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            ARGS="$ARGS --telegram --url ${PAGE_URL:-}"
          fi
          python macro_dashboard.py $ARGS

      - name: docs 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "대시보드 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git push
