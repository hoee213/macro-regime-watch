name: 변곡점 대시보드 갱신

on:
  schedule:
    # 매일 07:00 KST (22:00 UTC 전일)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'   # 러너 로그가 실시간으로 보이도록
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: 대시보드 생성
        timeout-minutes: 12
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "::error::FRED_API_KEY 시크릿이 없습니다. 러너 IP에서는 fredgraph CSV가 차단되므로 키가 필수입니다."
            exit 1
          fi
          ARGS="--out docs --json"
          # 시크릿이 등록돼 있을 때만 텔레그램 발송
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            ARGS="$ARGS --telegram --url ${PAGE_URL:-}"
          fi
          python macro_dashboard.py $ARGS

      - name: docs 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "대시보드 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git push
